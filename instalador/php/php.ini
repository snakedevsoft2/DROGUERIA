; ---------------------------------------------------------------------------
; PHP para el punto de venta de la droguería.
;
; Este PHP es independiente: no toca ningún otro PHP que haya en el equipo
; ni se registra en el PATH de Windows. Vive dentro de la carpeta del
; programa y sólo lo usa el programa.
; ---------------------------------------------------------------------------

; Ruta relativa a la carpeta de php.exe, para que el programa se pueda mover
; de carpeta (o de disco) sin reconfigurar nada.
extension_dir = "ext"

; --- Extensiones que necesita Laravel ---
extension=mbstring
extension=fileinfo
extension=openssl
extension=curl
extension=zip
extension=intl

; --- Base de datos: SQLite, un archivo en database/database.sqlite ---
extension=pdo_sqlite
extension=sqlite3

; --- Impresión: gd convierte el logo a los puntos que entiende la térmica ---
extension=gd

; ---------------------------------------------------------------------------
; Rendimiento
; ---------------------------------------------------------------------------
;
; La caja usa el servidor embebido de PHP, que corre en modo CLI: sin
; enable_cli la caché de opcodes no se activaría y cada escaneo recompilaría
; la aplicación entera (medido: 500ms por página contra 70ms con caché).

zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; ATENCIÓN: estas dos líneas no son opcionales.
;
; En Windows, opcache falla de forma intermitente al arrancar con
;   "Fatal Error Opcode handlers are unusable due to ASLR"
; y cuando eso pasa PHP no arranca, así que el programa no abre. Depende de
; cómo Windows haya repartido la memoria en ese arranque, de modo que puede
; funcionar cien veces y fallar la ciento una.
;
; Definir un caché en disco es el remedio que indica el propio mensaje de
; error. El instalador reemplaza esta ruta por una absoluta dentro de la
; carpeta del programa.
opcache.file_cache="cache"
opcache.file_cache_fallback=1

; --- Ajustes generales ---
date.timezone = America/Bogota
default_charset = "UTF-8"
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
post_max_size = 32M
upload_max_filesize = 32M

; El cajero no debe ver trazas de PHP en pantalla.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Sin un destino explícito, PHP escribe sus avisos en la salida de error, y
; esos aparecen en medio de las herramientas de diagnóstico: quien está
; revisando por qué no imprime se encuentra tres párrafos rojos sobre
; parámetros anulables de una librería, que no tienen nada que ver.
;
; Laravel sube el error_reporting a E_ALL por su cuenta, así que la línea de
; arriba no basta; lo que zanja el asunto es mandarlos a un archivo. El
; instalador reemplaza esta ruta por una absoluta dentro de la instalación.
error_log = "php-errores.log"

; Los temporales van a la carpeta TEMP del usuario de Windows, que siempre es
; escribible. No se fija una ruta relativa aquí: a diferencia de
; extension_dir, PHP resuelve sys_temp_dir contra la carpeta de trabajo del
; momento, no contra la de php.exe, y el servidor arranca parado en app\.

; Las sesiones las maneja Laravel en storage/framework/sessions.
session.save_handler = files

cgi.fix_pathinfo = 1
